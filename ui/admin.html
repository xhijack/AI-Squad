<!doctype html>
<html lang="en" data-theme="light" class="adminPage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · The AI Squad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='27' rx='2' fill='%23f2b544'/%3E%3Cg fill='%230f1320'%3E%3Crect x='10' y='7' width='4' height='4'/%3E%3Crect x='18' y='7' width='4' height='4'/%3E%3Crect x='10' y='14' width='4' height='4'/%3E%3Crect x='18' y='14' width='4' height='4'/%3E%3Crect x='13' y='22' width='6' height='8'/%3E%3C/g%3E%3C/svg%3E">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('aisquad.theme') || 'light'; } catch { /* private mode */ }</script>
<link rel="preload" href="vendor/fonts/plus-jakarta-sans-latin-400-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="adminPage">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15M2 21h20M9 21v-4h6v4M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>
</svg>
<header class="aTop">
  <button class="ghost iconBtn aBurger" id="aBurger" aria-label="Menu" data-i18n-aria><svg><use href="#i-menu"/></svg></button>
  <a class="aBrand" href="/" title="Back to the office" data-i18n-title><svg><use href="#i-building"/></svg><b id="aName">The AI Squad</b></a>
  <span class="aCrumb" id="aCrumb"></span>
  <span class="spacer"></span>
  <button class="aSearch" id="aSearch" aria-label="Search settings" data-i18n-aria><svg><use href="#i-search"/></svg><span class="hideSm" data-i18n>Search</span><kbd class="hideSm">Ctrl K</kbd></button>
  <a class="btn small" href="/" data-i18n>Office</a>
</header>
<div class="aShell">
  <nav class="aNav" id="aNav" aria-label="Admin"></nav>
  <main class="aMain" id="aMain" tabindex="-1"><div class="empty" data-i18n>Loading…</div></main>
</div>
<div class="aScrim" id="aScrim" hidden></div>

<dialog id="palette" class="palette" aria-label="Search settings">
  <input id="palIn" placeholder="Go to a setting or a Space…" autocomplete="off" data-i18n-placeholder>
  <ul id="palList" role="listbox"></ul>
</dialog>
<dialog id="pinDlg">
  <form method="dialog">
    <h3 data-i18n>Enter PIN</h3>
    <p class="note" data-i18n-html>Changes and agent screens are locked with the local PIN. Find it with <code>cat ~/.aisquad/pin</code> on this machine.</p>
    <label for="pinIn">PIN</label><input id="pinIn" inputmode="numeric" autocomplete="off" required>
    <div class="actions"><button value="cancel" class="ghost" formnovalidate data-i18n>Cancel</button><button value="ok" class="gold" data-i18n>Unlock</button></div>
  </form>
</dialog>
<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>The AI Squad needs JavaScript. / The AI Squad butuh JavaScript.</noscript>
<script type="module" src="admin-page.js"></script>
</body>
</html>
