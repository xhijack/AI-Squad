<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The AI Squad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='27' rx='2' fill='%23f2b544'/%3E%3Cg fill='%230f1320'%3E%3Crect x='10' y='7' width='4' height='4'/%3E%3Crect x='18' y='7' width='4' height='4'/%3E%3Crect x='10' y='14' width='4' height='4'/%3E%3Crect x='18' y='14' width='4' height='4'/%3E%3Crect x='13' y='22' width='6' height='8'/%3E%3C/g%3E%3C/svg%3E">
<script>try { document.documentElement.dataset.theme = localStorage.getItem('aisquad.theme') || 'light'; } catch { /* private mode */ }</script>
<link rel="preload" href="vendor/fonts/plus-jakarta-sans-latin-400-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15M2 21h20M9 21v-4h6v4M8 9h.01M12 9h.01M16 9h.01M8 13h.01M12 13h.01M16 13h.01"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3.5" y="4" width="4.5" height="16" rx="1.2"/><rect x="9.75" y="4" width="4.5" height="10" rx="1.2"/><rect x="16" y="4" width="4.5" height="13" rx="1.2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18M6.5 20v-6M11 20V6M15.5 20v-9M20 20V9"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.8 9.4c-.5-.9-1.5-1.4-2.8-1.4-1.7 0-2.8.8-2.8 1.9s1.1 1.6 2.8 2 2.8.9 2.8 2-1.1 2-2.8 2c-1.3 0-2.4-.5-2.9-1.4M12 6.5v11"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
  <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2.5 21c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5M19 8v6M16 11h6"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></symbol>

  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>

  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>

<div id="scene"></div>

<header id="hud" aria-label="Status"></header>
<div id="menu" class="popover" role="menu" hidden>
  <button role="menuitem" data-menu="setup-squad" data-owner data-i18n>Set up Squad</button>
  <button role="menuitem" data-menu="new-floor" data-owner data-i18n>New Floor</button>
  <button role="menuitem" data-menu="admin" data-i18n>Admin</button>
  <button role="menuitem" data-menu="people" data-owner data-i18n>People</button>
  <button role="menuitem" data-menu="templates" data-i18n>Role Templates</button>
  <button role="menuitem" data-menu="rename" data-owner data-i18n>Rename Building</button>
  <button role="menuitem" data-menu="theme"><span data-i18n>Theme</span>: <span id="themeName">Light</span></button>
  <button role="menuitem" data-menu="renderer"><span data-i18n>Scene view</span>: <span id="rendererName">Auto</span></button>
  <button role="menuitem" data-menu="quality"><span data-i18n>Graphics</span>: <span id="qualityName">Auto</span></button>
  <button role="menuitem" data-menu="language"><span data-i18n>Language</span>: <span id="langName">English</span></button>
  <button role="menuitem" data-menu="voice" data-i18n>Voice settings</button>
  <button role="menuitem" data-menu="signin" data-owner data-i18n>Claude sign-in</button>
  <button role="menuitem" data-menu="health" data-owner data-i18n>Backups and health</button>
  <button role="menuitem" data-menu="pin" data-i18n>Enter PIN</button>
</div>
<div id="floorMenu" class="popover" role="menu" hidden></div>
<div id="attPop" class="popover attPop" hidden></div>

<aside id="side" hidden>
  <section class="card sideCard" id="sideTop" hidden></section>
  <section class="card sideCard" id="sideMain" hidden></section>
  <section class="card sideCard grow" id="sideTabs" hidden></section>
</aside>
<button id="sideShow" class="floatBtn" hidden title="Show the panel" aria-label="Show the panel" data-i18n-title data-i18n-aria><svg><use href="#i-left"/></svg></button>
<section id="sheet" class="sheet" hidden>
  <button class="grip" id="grip" aria-label="Resize panel" data-i18n-aria></button>
  <div class="tabs" id="sheetTabs" role="tablist"></div>
  <div class="sheetBody" id="sheetBody"></div>
</section>
<nav id="elevator" aria-label="Elevator" hidden></nav>
<nav id="dock" aria-label="Dock"></nav>
<div id="legendPop" class="popover legend" hidden></div>
<div id="editBar" hidden></div>
<div id="followBar" hidden><button class="small ghost" data-follow="-1" aria-label="Previous agent" data-i18n-aria>‹</button><span id="followText"></span><button class="small ghost" data-follow="1" aria-label="Next agent" data-i18n-aria>›</button><button class="small" data-povdesk data-i18n>Desk</button><button class="small gold" data-povback data-i18n>Back (Esc)</button></div>
<div id="povBar" hidden><span id="povText"></span><span class="note hideSm" data-i18n>Drag to look around · scroll to zoom</span><button class="small" data-povdesk data-i18n>Desk</button><button class="small gold" data-povback data-i18n>Back (Esc)</button></div>

<dialog id="pinDlg">
  <form method="dialog">
    <h3 data-i18n>Enter PIN</h3>
    <p class="note" data-i18n-html>Changes and agent screens are locked with the local PIN. Find it with <code>cat ~/.aisquad/pin</code> on this machine.</p>
    <label for="pinIn">PIN</label><input id="pinIn" inputmode="numeric" autocomplete="off" required>
    <div class="actions"><button value="cancel" class="ghost" formnovalidate data-i18n>Cancel</button><button value="ok" class="gold" data-i18n>Unlock</button></div>
  </form>
</dialog>
<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>The AI Squad needs JavaScript. / The AI Squad butuh JavaScript.</noscript>
<script type="module">
// ?look=desk-poc opens the Phase 3.2 step 1 desk corner instead of the office (?look=realistic is the office itself)
if (new URLSearchParams(location.search).get('look') === 'desk-poc') import('./realistic.js'); else import('./app.js');
</script>
</body>
</html>
